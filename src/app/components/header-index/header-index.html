<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="container nav-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <div class="logo-icon">
        <img src="logo2.png" class="logo-img">
      </div>
      <span class="logo-text">
        Dev<span class="logo-accent">Folio</span>
      </span>
    </a>

    <!-- Nav Links desktop (colonne centrale) -->
    <ul class="nav-links">
      <li>
        <a [class.active]="activeSection === 'hero'" (click)="scrollToSection('hero', $event)" href="#">Accueil</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'features'" (click)="scrollToSection('features', $event)" href="#">Fonctionnalités</a>
      </li>
      <li>
        <a [class.active]="activeSection === 'footer'" (click)="scrollToSection('footer', $event)" href="#">Contact</a>
      </li>
    </ul>

    <!-- Actions desktop + hamburger -->
    <div class="nav-actions">
      <button class="btn btn-outline btn-sm" (click)="goLogin()">Connexion</button>
      <button class="hamburger" (click)="toggleMenu()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>

  <!-- Menu mobile déroulant -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul class="mobile-nav-links">
      <li><a [class.active]="activeSection === 'hero'" (click)="scrollToSection('hero', $event)" href="#">Accueil</a></li>
      <li><a [class.active]="activeSection === 'features'" (click)="scrollToSection('features', $event)" href="#">Fonctionnalités</a></li>
      <li><a [class.active]="activeSection === 'footer'" (click)="scrollToSection('footer', $event)" href="#">Contact</a></li>
    </ul>
  </div>

</nav>
