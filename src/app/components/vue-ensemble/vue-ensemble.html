<div class="vue-ensemble">

  <!-- Cartes stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--yellow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__value">{{ projects().length }}</span>
        <span class="stat-card__label">Projets</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__value">{{ completedProjects() }}</span>
        <span class="stat-card__label">Terminés</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--blue">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__value">{{ skills().length }}</span>
        <span class="stat-card__label">Compétences</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-card__icon stat-card__icon--orange">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>
      <div class="stat-card__info">
        <span class="stat-card__value">{{ unreadCount() }}</span>
        <span class="stat-card__label">Messages non lus</span>
      </div>
    </div>
  </div>

  <!-- Top compétences -->
  <div class="section">
    <div class="section__header">
      <h3 class="section__title">Top compétences</h3>
      <a routerLink="/skills" class="section__link">Voir tout</a>
    </div>
    <div class="skills-list">
      <div class="skill-row" *ngFor="let s of topSkills()">
        <span class="skill-row__name">{{ s.name }}</span>
        <div class="skill-row__bar">
          <div class="skill-row__fill" [style.width.%]="s.pct" [style.background]="s.color"></div>
        </div>
        <span class="skill-row__pct">{{ s.pct }}%</span>
      </div>
    </div>
  </div>

  <!-- Projets récents -->
  <div class="section">
    <div class="section__header">
      <h3 class="section__title">Projets récents</h3>
      <a routerLink="/projects" class="section__link">Voir tout</a>
    </div>
    <div class="projects-list">
      <div class="project-row" *ngFor="let p of projects().slice(0,4)">
        <div class="project-row__dot" [style.background]="p.color"></div>
        <span class="project-row__name">{{ p.name }}</span>
        <span class="project-row__stack">{{ p.stack }}</span>
        <span class="project-row__pct" [class.done]="p.pct === 100">{{ p.pct === 100 ? '✓ Terminé' : p.pct + '%' }}</span>
      </div>
    </div>
  </div>

</div>
