<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar__logo">
    <div class="sidebar__logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
      </svg>
    </div>
    <span class="sidebar__logo-text">DevFolio</span>
  </div>

  <!-- User Profile -->
  <div class="sidebar__user">
    <img class="sidebar__avatar" [src]="user.avatar" [alt]="user.name" />
    <div class="sidebar__user-info">
      <span class="sidebar__user-name">{{ user.name }}</span>
      <span class="sidebar__user-handle">{{ user.username }}</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    <ul class="sidebar__nav-list">
      <li *ngFor="let item of navItems" class="sidebar__nav-item">
        <button
          class="sidebar__nav-btn"
          [class.sidebar__nav-btn--active]="activeRoute === item.route"
          (click)="setActive(item.route)"
        >
          <span class="sidebar__nav-icon" [innerHTML]="getIcon(item.icon)"></span>
          <span class="sidebar__nav-label">{{ item.label }}</span>
          <span *ngIf="item.badge" class="sidebar__nav-badge">{{ item.badge }}</span>
        </button>
      </li>
    </ul>
  </nav>

  <!-- Logout -->
  <div class="sidebar__footer">
    <button class="sidebar__logout" >
      <span class="sidebar__nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span>Déconnexion</span>
    </button>
  </div>

</aside>
