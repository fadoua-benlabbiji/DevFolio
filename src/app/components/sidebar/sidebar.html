<!-- sidebar.html -->
<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar__logo">
    <a class="logo" (click)="logout()" style="cursor:pointer">
      <div class="logo-icon">
        <img src="logo2.png" class="logo-img" width="30px" height="30px">
      </div>
      <span class="sidebar__logo-text">DevFolio</span>
    </a>
  </div>

  <!-- User Profile -->
  <div class="sidebar__user">
    @if (user().avatar) {
      <img class="sidebar__avatar" [src]="user().avatar" [alt]="user().name" />
    } @else {
      <div class="sidebar__avatar sidebar__avatar--initials">
        {{ user().name | initiales }}
      </div>
    }
    <div class="sidebar__user-info">
      <span class="sidebar__user-name">{{ user().name }}</span>
      <span class="sidebar__user-handle">{{ user().username }}</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    <ul class="sidebar__nav-list">
      @for (item of Items; track item.route) {
        <li class="sidebar__nav-item">
          <button
            class="sidebar__nav-btn"
            [routerLink]="item.route"
            [class.sidebar__nav-btn--active]="isActive(item.route)"
             (click)="titleChange.emit(item.label)"
          >
            <span class="sidebar__nav-icon" [innerHTML]="getIcon(item.icon)">getIcon(item.icon)</span>
            <span class="sidebar__nav-label">{{ item.label }}</span>
            @if (item.badgeFn && item.notif > 0) {
              <span class="sidebar__nav-badge">{{ item.badgeFn() }}</span>
            }
          </button>
        </li>
      }
    </ul>
  </nav>

  <!-- Logout -->
  <div class="sidebar__footer">
    <button class="sidebar__logout" (click)="logout()">
      <span class="sidebar__nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span>Déconnexion</span>
    </button>
  </div>

</aside>
