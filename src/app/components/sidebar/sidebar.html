<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar__logo">
    <a class="logo" [routerLink]="['/']" style="cursor:pointer">
      <div class="logo-icon">
        <img src="logo2.png" class="logo-img" width="30" height="30" />
      </div>
      <span class="sidebar__logo-text">DevFolio</span>
    </a>
  </div>

  <!-- User -->
  <div class="sidebar__user">
    @if (user().avatar) {
      <img class="sidebar__avatar" [src]="user().avatar" [alt]="user().name" />
    } @else {
      <div class="sidebar__avatar sidebar__avatar--initials">
        {{ user().name | initiales }}
      </div>
    }
    <div class="sidebar__user-info">
      <span class="sidebar__user-name">{{ user().name }}</span>
      <span class="sidebar__user-handle">{{ user().username }}</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar__nav">
    <ul class="sidebar__nav-list">

      <!-- Vue d'ensemble -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/vue-ensemble'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/vue-ensemble')"
          (click)="titleChange.emit('Vue d\'ensemble')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
              <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Vue d'ensemble</span>
        </button>
      </li>

      <!-- Projets -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/projects'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/projects')"
          (click)="titleChange.emit('Projets')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Projets</span>
        </button>
      </li>

      <!-- Compétences -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/skills'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/skills')"
          (click)="titleChange.emit('Compétences')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Compétences</span>
        </button>
      </li>

      <!-- Messages -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/messages'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/messages')"
          (click)="titleChange.emit('Messages')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Messages</span>
          @if (nb > 0) {
            <span class="sidebar__nav-badge">{{ nb }}</span>
          }
        </button>
      </li>

      <!-- Générer CV -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/cv'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/cv')"
          (click)="titleChange.emit('Générer CV')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Générer CV</span>
        </button>
      </li>

      <!-- Mon DevFolio -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/devfolio'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/devfolio')"
          (click)="titleChange.emit('Mon DevFolio')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Mon DevFolio</span>
        </button>
      </li>

      <!-- Paramètres -->
      <li class="sidebar__nav-item">
        <button class="sidebar__nav-btn" [routerLink]="'/dashboard/settings'"
          [class.sidebar__nav-btn--active]="isActive('/dashboard/settings')"
          (click)="titleChange.emit('Paramètres')">
          <span class="sidebar__nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          <span class="sidebar__nav-label">Paramètres</span>
        </button>
      </li>

    </ul>
  </nav>

  <!-- Logout -->
  <div class="sidebar__footer">
    <button class="sidebar__logout" (click)="logout()">
      <span class="sidebar__nav-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      <span>Déconnexion</span>
    </button>
  </div>
</aside>
