<div class="skills-page">

  <!-- En-tête de page -->
  <div class="skills-header">
    <div class="skills-header__left">
      <h2 class="skills-header__title">Compétences</h2>
      <p class="skills-header__count">{{ skills().length }} compétence(s)</p>
    </div>
    <button class="btn-add" (click)="openAdd()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Ajouter
    </button>
  </div>

  <!-- Groupes par catégorie -->
  <div class="skills-groups">
    <div class="skill-group" *ngFor="let entry of groupEntries">
      <div class="skill-group__header">
        <span class="skill-group__dot"></span>
        <span class="skill-group__name">{{ entry[0] }}</span>
        <span class="skill-group__count">({{ entry[1].length }})</span>
      </div>

      <div class="skill-tags">
        <div class="skill-tag" *ngFor="let skill of entry[1]">
          <span class="skill-tag__name">{{ skill.name }}</span>
          <span class="skill-tag__pct" [style.background-color]="pctColor(skill.pct) + '22'" [style.color]="pctColor(skill.pct)">
            {{ skill.pct }}%
          </span>
          <button class="skill-tag__edit" (click)="openEdit(skill)" title="Modifier">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </button>
          <button class="skill-tag__remove" (click)="delete(skill.id)" title="Supprimer">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- État vide -->
    <div class="skills-empty" *ngIf="skills().length === 0">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
      <p>Aucune compétence pour l'instant.</p>
      <button class="btn-add" (click)="openAdd()">+ Ajouter une compétence</button>
    </div>
  </div>
</div>

<!-- Modal formulaire -->
<div class="modal-overlay" *ngIf="showForm()" (click)="cancel()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal__header">
      <h3 class="modal__title">{{ editingId() !== null ? 'Modifier la compétence' : 'Nouvelle compétence' }}</h3>
      <button class="modal__close" (click)="cancel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="form-group">
        <label class="form-label">Nom de la compétence *</label>
        <input class="form-input" [(ngModel)]="form.name" placeholder="ex: React, Docker, Python…" />
      </div>

      <div class="form-group">
        <label class="form-label">Catégorie *</label>
        <select class="form-input" [(ngModel)]="form.category">
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Niveau : <strong>{{ form.pct }}%</strong></label>
        <input class="form-range" type="range" [(ngModel)]="form.pct" min="1" max="100" />
        <div class="range-labels">
          <span>Débutant</span>
          <span>Intermédiaire</span>
          <span>Expert</span>
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <button class="btn-cancel" (click)="cancel()">Annuler</button>
      <button class="btn-save" (click)="save()" [disabled]="!form.name.trim()">
        {{ editingId() !== null ? 'Enregistrer' : 'Ajouter' }}
      </button>
    </div>
  </div>
</div>
