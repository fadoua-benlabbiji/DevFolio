<div class="settings-container">
  <div class="settings-header">
  <div class="settings-card">
    <!-- SECTION AVATAR -->
    <div class="avatar-section">
      <div class="avatar-wrapper">
        @if (form.avatar && !imageError) {
          <img class="avatar-image" [src]="form.avatar" (error)="imageError = true" alt="Avatar" />
        } @else {
          <div class="avatar-placeholder">
            {{ form.nom.charAt(0).toUpperCase() }}
          </div>
        }
      </div>
    </div>

    <!-- NOM COMPLET + USERNAME -->
    <div class="form-row">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" [(ngModel)]="form.nom" placeholder="Lina Bensalem" />
      </div>
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" [(ngModel)]="form.username" placeholder="lina-dev" />
      </div>
    </div>

    <!-- TITRE PROFESSIONNEL -->
    <div class="form-group">
      <label>Titre professionnel</label>
      <input type="text" [(ngModel)]="form.titre" placeholder="Développeuse Full-Stack" />
    </div>

    <!-- BIO -->
    <div class="form-group">
      <label>Bio</label>
      <textarea [(ngModel)]="form.bio" rows="4" placeholder="Passionnée par les interfaces élégantes..."></textarea>
    </div>

    <!-- SEPARATEUR -->
    <div class="form-divider"></div>

    <!-- EMAIL + LOCALISATION -->
    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" placeholder="lina@example.com" />
      </div>
      <div class="form-group">
        <label>Localisation</label>
        <input type="text" [(ngModel)]="form.ville" placeholder="Casablanca, Maroc" />
      </div>
    </div>

    <!-- SEPARATEUR -->
    <div class="form-divider"></div>

    <!-- RÉSEAUX SOCIAUX (3 colonnes) -->
    <div class="form-row-3">
      <div class="form-group">
        <label>GitHub</label>
        <input type="url" [(ngModel)]="form.github" placeholder="https://github.com/username" />
      </div>
      <div class="form-group">
        <label>LinkedIn</label>
        <input type="url" [(ngModel)]="form.linkedin" placeholder="https://linkedin.com/in/username" />
      </div>
      <div class="form-group">
        <label>Site web</label>
        <input type="url" [(ngModel)]="form.website" placeholder="https://example.com" />
      </div>
    </div>

    <!-- BOUTON ENREGISTRER -->
    <button class="btn-save" (click)="saveSettings()">
      Enregistrer
    </button>
  </div>
</div>
